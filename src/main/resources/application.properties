spring.application.name=backend-springboot
server.port=8080

# Classic Google reCAPTCHA v3
app.recaptcha.enabled=true
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.expected-action=public_payment_search
app.recaptcha.minimum-score=0.5

# H2 file database
spring.datasource.url=jdbc:h2:file:./data/kwsp-payment-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console for local development only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do not expose backend errors to public users
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Audit logging
logging.level.KWSP_AUDIT=INFO

# Save application logs locally
logging.file.name=logs/backend-springboot.log