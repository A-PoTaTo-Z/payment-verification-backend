spring.application.name=backend-springboot

# Render supplies PORT; localhost falls back to 8080
server.port=${PORT:8080}

# Classic Google reCAPTCHA v3
app.recaptcha.enabled=true
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.expected-action=public_payment_search
app.recaptcha.minimum-score=0.5

# H2 in-memory database for prototype deployment
# Demo records are recreated by DatabaseInitializer after each restart
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Disable the H2 console for deployed environments
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Do not expose backend errors to public users
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Audit logging
logging.level.KWSP_AUDIT=INFO

app.frontend.url=${FRONTEND_URL:http://localhost:4200}